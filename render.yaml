services:
  # Backend Web Service
  - type: web
    name: securegate-backend
    env: python
    rootDirectory: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480
      - key: SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        placeholder: "mongodb+srv://user:pass@cluster.mongodb.net/event_access"
      - key: MONGO_DB_NAME
        value: event_access
      - key: ALLOWED_ORIGINS
        placeholder: '["https://securegate-frontend.onrender.com"]'
      - key: FRONTEND_URL
        placeholder: "https://securegate-frontend.onrender.com"

  # Frontend Static Site
  - type: static
    name: securegate-frontend
    rootDirectory: frontend
    buildCommand: npm install && npm run build
    publishDirectory: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # SPA rewrite rule to route all frontend paths to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        placeholder: "https://securegate-backend.onrender.com"
